# Automatically build the branch and run the configured tests on every push and
# submitted pull request through the shared build-jar workflow, which also
# uploads the jar as an artifact.
#
# Releases are published from main only, so this workflow never creates one.

name: build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-jar.yml

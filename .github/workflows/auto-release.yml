# Publishes one release from main, carrying one jar per supported Minecraft
# branch.
#
# The version branches (mc-26.2, mc-26.3) never release: they run build-jar.yml
# on every push. A v-prefixed commit on main builds each branch listed in the
# prepare job through that same reusable workflow and publishes the jars
# together, so the download page always offers the build that matches a
# server's Minecraft version.

name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 26.3-1.3.1). Leave empty to use version.txt.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      branches: ${{ steps.release.outputs.branches }}
    steps:
      - name: Parse release version and channel
        id: release
        shell: bash
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          VERSION_INPUT: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # The first line of the commit on main is the release: either the bare
          # version (v26.3-1.3.1) or the version plus a short description
          # (v26.3-1.3.1: new console completion). Only the leading token is the
          # version. A manual dispatch may pass the version directly.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_INPUT="${VERSION_INPUT}"
            if [[ -z "$RELEASE_INPUT" ]]; then
              RELEASE_INPUT="$(tr -d '[:space:]' < version.txt)"
            fi
          else
            RELEASE_INPUT="${COMMIT_TITLE%%$'\n'*}"
          fi
          RELEASE_INPUT="${RELEASE_INPUT#v}"
          RELEASE_INPUT="${RELEASE_INPUT%%:*}"
          RELEASE_INPUT="${RELEASE_INPUT%%$' '*}"
          RELEASE_INPUT="${RELEASE_INPUT,,}"

          if [[ "$RELEASE_INPUT" =~ ^(.+)-(stable|beta|alpha|rc)([.-]?[0-9]+)?$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            CHANNEL="${BASH_REMATCH[2]}"
            CHANNEL_SUFFIX="${BASH_REMATCH[3]:-}"
          else
            BASE_VERSION="$RELEASE_INPUT"
            CHANNEL="stable"
            CHANNEL_SUFFIX=""
          fi

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+([.][0-9]+)*(-[0-9]+([.][0-9]+)*)?$ ]]; then
            echo "Invalid release commit format: v${RELEASE_INPUT}" >&2
            echo "Expected examples: v26.3-1.3.1, v26.3-1.3.1-beta, v26.3-1.3.1-rc1" >&2
            exit 1
          fi

          if [[ "$CHANNEL" == "stable" && -z "$CHANNEL_SUFFIX" ]]; then
            VERSION="$BASE_VERSION"
            PRERELEASE=false
          elif [[ "$CHANNEL" == "stable" ]]; then
            VERSION="${BASE_VERSION}-stable${CHANNEL_SUFFIX}"
            PRERELEASE=false
          else
            VERSION="${BASE_VERSION}-${CHANNEL}${CHANNEL_SUFFIX}"
            PRERELEASE=true
          fi

          # The release tag has no "v" prefix (e.g. 26.3-1.3.1), even though the
          # triggering commit message starts with "v".
          TAG="${VERSION}"
          RELEASE_NAME="DedicatedPower ${VERSION}"

          # Every Minecraft branch whose jar the release carries. Add a branch
          # here when a new Minecraft line is added, and keep build-jar.yml on
          # that branch so it can be built.
          BRANCHES='["mc-26.2","mc-26.3"]'

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "name=${RELEASE_NAME}"
            echo "channel=${CHANNEL}"
            echo "prerelease=${PRERELEASE}"
            echo "branches=${BRANCHES}"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Channel: ${CHANNEL}"
          echo "Prerelease: ${PRERELEASE}"
          echo "Tag: ${TAG}"
          echo "Branches: ${BRANCHES}"

  build:
    name: Build ${{ matrix.branch }}
    needs: prepare
    strategy:
      # One failing branch must not stop the other jars from being released.
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    uses: ./.github/workflows/build-jar.yml
    with:
      ref: ${{ matrix.branch }}

  release:
    name: Publish release
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download every branch jar
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dedicatedpower-*
          merge-multiple: true

      - name: Check the collected jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          JARS=(dist/*.jar)
          if [[ ${#JARS[@]} -eq 0 ]]; then
            echo "No branch produced a jar, nothing to publish." >&2
            exit 1
          fi
          printf 'Publishing %d jar(s):\n' "${#JARS[@]}"
          printf ' - %s\n' "${JARS[@]}"

      - name: Extract changelog section
        id: changelog
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # Grab the Keep a Changelog section for this version (## [<version>] ...)
          if [[ ! -f CHANGELOG.md ]]; then
            SECTION=""
          else
            SECTION="$(awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi

          if [[ -z "$SECTION" ]]; then
            SECTION="*No changelog entry found for version ${VERSION}.*"
          fi

          # EOF-delimited output so multiline content survives workflow outputs
          {
            echo "section<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for an existing release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A release tag named ${RELEASE_TAG} already exists. Use a new version in the commit message." >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## DedicatedPower ${{ needs.prepare.outputs.version }}

            **Release channel:** `${{ needs.prepare.outputs.channel }}`
            **Included builds:** one jar per supported Minecraft branch. Download the jar that matches your server version.

            ${{ steps.changelog.outputs.section }}

            ---

            This release was built automatically from commit `${{ github.sha }}` on `main`.
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
